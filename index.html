<!DOCTYPE html>
<html lang="nl">
<head> 
    <meta charset = "UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Rookvrij">
    <link rel="apple-touch-icon" href="icoon.png">
    <title>Rookvrij</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>Rookvrij</h1>

    <div>
        <p id="motivatieTekst">prraaaar</p>
    </div>

    <div class="kaart">
        <p class="groot" id="dagenGetal">0</p>
        <p class="bijschrift" id="dagenTekst">dagen rookvrij</p>
    </div>

    <div class="kaart">
        <p class="groot" id="bespaardGetal">€0</p>
        <p class="bijschrift" id="bespaardTekst">bespaard</p>
    </div>

    <div class="kaart">
        <p class="groot" id="peukenGetal">0</p>
        <p class="bijschrift" id="peukenTekst">ongerookte peukies 🚬</p>
    </div>

    <div class="kaart">
        <h2>Waarom ik stop</h2>
        <ul id="redenenLijst"></ul>
    </div>

    <div class="kaart">
        <h2>Trek?</h2>

        <label for="triggerKeuze">Wat speelde er?</label>
        <select class="invoer" id="triggerKeuze">
            <option>Stress</option>
            <option>Koffie</option>
            <option>Na het eten</option>
            <option>Alcohol</option>
            <option>Verveling</option>
            <option>Sociale druk</option>
            <option>Had nog sigaretten over</option>
            <option>Anders</option>
        </select>

        <label for="intensiteit">Hoe sterk? <span id="intensiteitWaarde">5</span>/10</label>
        <input class="invoer" type="range" id="intensiteit" min="1" max="10" value="5">

        <button class="knop" id="trekKnop">Vastleggen</button>

        <button class="knop waarschuwing" id="gerooktKnop">Gerookt?</button>

        <p class="bijschrift" id="trekVandaag">Vandaag: 0 keer trek</p>

        <p class="bijschrift" id="trekTotaal">Totaal aantal trekmomenten: 0 keer trek</p>
    </div>

    <button id="instellingenKnop"> ⚙︎ </button>

    <div id="instellingenPaneel" hidden>
        <div class="kaart">
            <h2>Stopdatum</h2>
            <input class="invoer" type="date" id="datumInvoer">
            <button class="knop" id="opslaanKnop">Opslaan</button>
        </div>

        <div class="kaart">
            <h2>Instellingen</h2>
            <label for="perDagInvoer">Sigaretten per dag: </label>
            <input class="invoer" type="number" id="perDagInvoer" min="0">

            <label for="prijsInvoer">Prijs per pakje: </label>
            <input class="invoer" type="number" id="prijsInvoer" min="0" step="0.01">

            <label for="perPakjeInvoer">Sigaretten per pakje: </label>
            <input class="invoer" type="number" id="perPakjeInvoer" min="0">

            <button class="knop" id="instellingenOpslaan">Opslaan</button>
        </div>

        <div class="kaart">
            <h2>Motivatie</h2>
            <label for="motivatieInvoer">Motiverende zin</label>
            <textarea class="invoer" id="motivatieInvoer" rows="3" maxlength="100" placeholder="Dit is mijn motivatie..."></textarea>
            <label for="motivatieInvoer"><span id="motivatieTekstLimiet">0</span>/100</label>

            <label for="redenenInvoer">Redenen</label>
            <textarea class="invoer" id="redenenInvoer" placeholder="Beter kunnen sporten&#10;Geld sparen"></textarea>
            
            <button class="knop" id="redenenEnMotivatieOpslaanKnop">Opslaan</button>
        </div>

        <div class="kaart">
            <h2>Data</h2>
            <button class="knop" id="exportKnop">Export</button>

            <label class="knop" for="importInvoer">  Importeren</label>
            <input type="file" id="importInvoer" accept=".csv" hidden>
        </div>

        <div class="kaart">
            <h2>Logboek</h2>
            <ul id="rookLog"></ul>
            <p class="bijschrift" id="meldingLegeRookLog">Nog niet gerookt!</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
